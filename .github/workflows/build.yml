name: Build Cross-Platform Game Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    - name: Restore dependencies
      run: dotnet restore src/GridForge.Android/GridForge.Android.csproj

    - name: Publish Android App
      run: dotnet publish src/GridForge.Android/GridForge.Android.csproj -c Release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GridForge-Android-APK
        path: src/GridForge.Android/bin/Release/net9.0-android/publish/*.apk