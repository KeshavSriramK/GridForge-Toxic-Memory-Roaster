name: Build Cross-Platform Game Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CheckEolTargetFramework: "false"

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore src/GridForge.Desktop/GridForge.Desktop.csproj

      - name: Build Desktop
        run: dotnet build src/GridForge.Desktop/GridForge.Desktop.csproj -c Release

  build-android:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android --configfile nuget.config

    - name: Restore dependencies
      run: dotnet restore src/GridForge.Android/GridForge.Android.csproj -p:CheckEolTargetFramework=false

    - name: Publish Android App
      run: dotnet publish src/GridForge.Android/GridForge.Android.csproj -c Release -p:CheckEolTargetFramework=false