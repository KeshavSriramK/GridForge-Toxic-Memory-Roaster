build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore src/GridForge.Android/GridForge.Android.csproj /p:CheckEolTargetFramework=false

      - name: Build Android App
        run: dotnet build src/GridForge.Android/GridForge.Android.csproj -c Release -f net8.0-android /p:CheckEolTargetFramework=false